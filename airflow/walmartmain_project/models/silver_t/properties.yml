models:
  - name: products_t
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      - name: price
        data_tests:
          - greater_than:
              arguments:
                value: 0

  - name: orders_t
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique


