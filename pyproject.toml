[project]
name = "data-retail-dbt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "airflow-operators>=0.11.0",
    "apache-airflow>=3.3.1",
    "dbt-core>=1.12.4",
    "dbt-databricks>=1.10.9",
]

[project.scripts]
data-retail-dbt = "data_retail_dbt:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "airflow",
]
